<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Crect x='.5' y='.5' width='31' height='31' rx='6.5' fill='%2338bdf8' fill-opacity='.1' stroke='%2338bdf8' stroke-opacity='.3'/%3E%3Cg transform='translate(4 4)'%3E%3Cpath d='M13 10V3L4 14h7v7l9-11h-7z' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hydroflow" />
    <script>
      // Applique le theme avant le premier rendu (evite un flash). Meme regle que composables/useTheme.ts :
      // theme enregistre s'il est impose, sinon theme du systeme, sombre si le navigateur ne sait pas.
      (function () {
        try {
          var saved = localStorage.getItem('ui_theme')
          var dark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : true
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light',
          )
        } catch (e) {}
      })()
    </script>
    <title>hydroflow</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
